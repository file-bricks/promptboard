<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b2d8e" />
      <stop offset="100%" stop-color="#7b4db5" />
    </linearGradient>
    
    <!-- Glow Gradients -->
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b4db5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7b4db5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ec6f5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6ec6f5" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Blur Filter -->
    <filter id="shadow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="1200" height="280" fill="url(#bg-grad)" />

  <!-- Ambient Glows -->
  <circle cx="240" cy="140" r="320" fill="url(#glow-1)" />
  <circle cx="950" cy="120" r="380" fill="url(#glow-2)" />

  <!-- Moving Speed Lines in Background -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" stroke-linecap="round">
    <path d="M 50,55 L 1150,55" stroke-dasharray="100 800">
      <animate attributeName="stroke-dashoffset" from="900" to="0" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 50,115 L 1150,115" stroke-dasharray="140 680">
      <animate attributeName="stroke-dashoffset" from="820" to="0" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 50,175 L 1150,175" stroke-dasharray="80 900">
      <animate attributeName="stroke-dashoffset" from="980" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 50,235 L 1150,235" stroke-dasharray="120 740">
      <animate attributeName="stroke-dashoffset" from="860" to="0" dur="3.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Background Floating Capsules -->
  <!-- Capsule 1: PROMPTS -->
  <g transform="translate(820, 50) rotate(-6)">
    <rect x="0" y="0" width="105" height="30" rx="15" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <text x="52.5" y="19" text-anchor="middle" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">PROMPTS</text>
  </g>
  <!-- Capsule 2: SKILLS -->
  <g transform="translate(1010, 85) rotate(8)">
    <rect x="0" y="0" width="90" height="30" rx="15" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <text x="45" y="19" text-anchor="middle" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SKILLS</text>
  </g>
  <!-- Capsule 3: WORKFLOWS -->
  <g transform="translate(480, 35) rotate(4)">
    <rect x="0" y="0" width="125" height="30" rx="15" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <text x="62.5" y="19" text-anchor="middle" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">WORKFLOWS</text>
  </g>
  <!-- Capsule 4: ROLES -->
  <g transform="translate(760, 225) rotate(-4)">
    <rect x="0" y="0" width="85" height="30" rx="15" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <text x="42.5" y="19" text-anchor="middle" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ROLES</text>
  </g>
  <!-- Capsule 5: AGENTS -->
  <g transform="translate(970, 215) rotate(6)">
    <rect x="0" y="0" width="95" height="30" rx="15" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
    <text x="47.5" y="19" text-anchor="middle" fill="#ffffff" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">AGENTS</text>
  </g>

  <!-- Skateboard Shadow (Grounded) -->
  <ellipse cx="240" cy="245" rx="85" ry="7" fill="#180c2b" fill-opacity="0.55" filter="url(#shadow-blur)">
    <animate attributeName="rx" values="85; 76; 85" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.55; 0.35; 0.55" dur="3s" repeatCount="indefinite" />
  </ellipse>

  <!-- Skateboard Rider Character Group -->
  <g id="character-group" transform="translate(240, 195)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="240 195; 240 187; 240 195"
      dur="3s"
      repeatCount="indefinite"
      additive="sum" />

    <!-- Left Arm Outline -->
    <path d="M -55,-80 L -80,-65 L -110,-75" fill="none" stroke="#e2d9ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-110" cy="-75" r="12" fill="#e2d9ff" />

    <!-- Right Arm Outline -->
    <path d="M 55,-80 L 80,-65 L 110,-75" fill="none" stroke="#e2d9ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="110" cy="-75" r="12" fill="#e2d9ff" />

    <!-- Left Arm Fill -->
    <path d="M -55,-80 L -80,-65 L -110,-75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-110" cy="-75" r="8" fill="#ffffff" />

    <!-- Right Arm Fill -->
    <path d="M 55,-80 L 80,-65 L 110,-75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="110" cy="-75" r="8" fill="#ffffff" />

    <!-- Paper Body Sheet Outline & Fill -->
    <path d="M -43,-155 L 25,-155 L 55,-125 L 55,-17 Q 55,-5 43,-5 L -43,-5 Q -55,-5 -55,-17 L -55,-143 Q -55,-155 -43,-155 Z" fill="#ffffff" stroke="#e2d9ff" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Paper Folded Flap -->
    <path d="M 25,-155 L 25,-125 L 55,-125 Z" fill="#eae3ff" stroke="#e2d9ff" stroke-width="4" stroke-linejoin="round" />

    <!-- Eyes (Two Dots) -->
    <circle cx="-20" cy="-115" r="10" fill="#1b1c26" />
    <circle cx="20" cy="-115" r="10" fill="#1b1c26" />

    <!-- Sky Blue Text Lines -->
    <line x1="-32" y1="-98" x2="32" y2="-98" stroke="#6ec6f5" stroke-width="8" stroke-linecap="round" />
    <line x1="-32" y1="-64" x2="32" y2="-64" stroke="#6ec6f5" stroke-width="8" stroke-linecap="round" />
    <line x1="-32" y1="-46" x2="32" y2="-46" stroke="#6ec6f5" stroke-width="8" stroke-linecap="round" />

    <!-- Smile (Curved mouth) -->
    <path d="M -18,-83 Q 0,-63 18,-83" fill="none" stroke="#1b1c26" stroke-width="6" stroke-linecap="round" />

    <!-- Skateboard Trucks -->
    <path d="M -72,12 L -58,12 L -61,32 L -69,32 Z" fill="#1b1c26" />
    <path d="M 58,12 L 72,12 L 69,32 L 61,32 Z" fill="#1b1c26" />

    <!-- Skateboard Wheels -->
    <!-- Wheel Left -->
    <g transform="translate(-65, 32)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="1.2s"
          repeatCount="indefinite" />
        <circle cx="0" cy="0" r="25" fill="none" stroke="#e2d9ff" stroke-width="3" />
        <circle cx="0" cy="0" r="23" fill="#1b1c26" />
        <circle cx="0" cy="0" r="14" fill="#a9b9cf" />
        <circle cx="0" cy="0" r="8" fill="#2f3542" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#2f3542" stroke-width="2" />
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#2f3542" stroke-width="2" />
      </g>
    </g>

    <!-- Wheel Right -->
    <g transform="translate(65, 32)">
      <g>
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="1.2s"
          repeatCount="indefinite" />
        <circle cx="0" cy="0" r="25" fill="none" stroke="#e2d9ff" stroke-width="3" />
        <circle cx="0" cy="0" r="23" fill="#1b1c26" />
        <circle cx="0" cy="0" r="14" fill="#a9b9cf" />
        <circle cx="0" cy="0" r="8" fill="#2f3542" />
        <circle cx="0" cy="0" r="3" fill="#ffffff" />
        <line x1="0" y1="-14" x2="0" y2="14" stroke="#2f3542" stroke-width="2" />
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#2f3542" stroke-width="2" />
      </g>
    </g>

    <!-- Skateboard Deck layers (sandwich) -->
    <!-- Yellow deck body -->
    <path d="M -110,-10 Q 0,15 110,-10 L 110,-2 Q 0,23 -110,-2 Z" fill="#f5c842" />
    <!-- Top black grip tape -->
    <path d="M -110,-14 Q 0,11 110,-14 L 110,-10 Q 0,15 -110,-10 Z" fill="#1b1c26" />
    <!-- Bottom black trim -->
    <path d="M -110,-2 Q 0,23 110,-2 L 105,3 Q 0,26 -105,3 Z" fill="#1b1c26" />
  </g>

  <!-- Typography -->
  <!-- Wordmark -->
  <text x="420" y="135" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5px">PromptBoard<tspan fill="#f5c842">.</tspan></text>
  
  <!-- Tagline -->
  <text x="420" y="180" fill="#ffffff" fill-opacity="0.85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="-0.2px">Your local prompt library. Fast. Offline. Tray-ready.</text>
</svg>
